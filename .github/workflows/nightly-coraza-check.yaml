name: Nightly Coraza Check
on:
  pull_request:
    paths:
      - ".github/workflows/nightly-coraza-check.yaml"
      - ".github/workflows/ci.yaml"
  schedule:
    - cron: "0 4 * * *"

permissions: {}

env:
  GO_VERSION: '1.25'
  # TinyGo 0.39 is the first release supporting Go 1.25 (needed by coraza v3.8.x) that boots under Envoy.
  TINYGO_VERSION: 0.39.0
  # -buildmode=wasi-legacy post-processes the module with wasm-opt.
  BINARYEN_VERSION: version_133

jobs:
  test:
    name: "Test (multiphase evaluation: ${{ matrix.multiphase_eval }})"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        multiphase_eval: ["true","false"]
    env:
      MULTIPHASE_EVAL: ${{ matrix.multiphase_eval }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install TinyGo
        run: |
          gh release download v${TINYGO_VERSION} -p '*.linux-amd64.tar.gz' -D ~ -R github.com/tinygo-org/tinygo
          tar -xf ~/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz  -C $HOME
          echo "$HOME/tinygo/bin" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install binaryen (wasm-opt)
        run: |
          gh release download ${BINARYEN_VERSION} -p "binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" -D ~ -R github.com/WebAssembly/binaryen
          tar -xf ~/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz -C $HOME
          echo "$HOME/binaryen-${BINARYEN_VERSION}/bin" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache TinyGo build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v3
        with:
          path: |
            ~/.cache/tinygo
          key: ${{ runner.os }}-tinygo-${{ env.TINYGO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tinygo-${{ env.TINYGO_VERSION }}-

      - name: Get last commit of coraza
        id: coraza-latest-commit
        run: echo "value=$(gh api repos/corazawaf/coraza/commits/main -q .sha)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch last coraza version
        # Drop the vendored fork (third_party/coraza) so upstream main is what gets tested.
        run: |
          go mod edit -dropreplace github.com/corazawaf/coraza/v3
          go get -u github.com/corazawaf/coraza/v3@${{ steps.coraza-latest-commit.outputs.value }} && go mod tidy

      - name: Build WASM filter
        run: go run mage.go build

      - name: Run unit tests
        run: go run mage.go coverage

      - name: Run e2e tests
        run: go run mage.go e2e
